name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build swig ant sqlite3

      - name: Build native libraries (16 KB page aligned)
        run: |
          cd gdal
          ../submodules/install.sh "$ANDROID_NDK_LATEST_HOME" 21

      - name: Build aar
        run: |
          chmod 755 gradlew
          ./gradlew assembleRelease

      - name: Check 16 KB alignment
        run: |
          mkdir aar && cd aar
          unzip -q ../gdal/build/outputs/aar/gdal-release.aar
          # 16 KB pages only exist on 64-bit devices; the NDK's 32-bit
          # libc++_shared.so is still 4 KB aligned.
          fail=0
          for so in jni/arm64-v8a/*.so jni/x86_64/*.so; do
            for align in $(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}'); do
              if [ $((align)) -lt 16384 ]; then echo "$so: LOAD align $align"; fail=1; fi
            done
          done
          exit $fail

      - name: Upload aar
        uses: actions/upload-artifact@v5
        with:
          name: gdal-aar
          path: gdal/build/outputs/aar/
