apply plugin: 'com.android.library'

// The native libraries and gdal.jar are produced by ../submodules/install.sh,
// which must be run before building this module.
android {
    namespace 'eu.paamand.gdal'
    compileSdk 35

    defaultConfig {
        minSdk 21
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        // install.sh already strips the libraries
        jniLibs {
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
